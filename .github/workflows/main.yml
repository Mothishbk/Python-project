name: Python-Sonar-Project

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions: read-all

jobs:

  build:

    name: Test and run Sonar scan
    runs-on: ubuntu-latest

    steps:
      - name: git code checkout

        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: install requirments / dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python install pytest pytest-cov

      - name: Run PY test with coverage

        run: |
          pytest --cov=app \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --disable-warnings



      - name: Sonarscan check
        uses:
              SonarSource/sonarqube-scan-action@v6

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
