name: Python-Sonar-Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: Test and run Sonar scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python-Project-For--Sonar-Demo-main   # all run: steps happen inside this folder

    steps:
      - name: Git code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python-Project-For--Sonar-Demo-main/requirements.txt

      - name: Install requirements / dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=app \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --disable-warnings

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: Python-Project-For--Sonar-Demo-main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
